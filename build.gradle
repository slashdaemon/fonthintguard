plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.144' apply false
    id 'fabric-loom' version '1.13.6' apply false
}

// The root project runs the FreeType unit tests. They need only HintFlags (no Minecraft), so main
// compiles just that one shared file; the mod jars come from versions/*.

allprojects {
    version = project.mod_version
    group = project.maven_group

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = 'UTF-8'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    main {
        java {
            srcDirs = ['common/src/main/java']
            include 'dev/blockacademy/fonthintguard/HintFlags.java'
        }
        resources.srcDirs = []
    }
    test {
        java.srcDirs = ['common/src/test/java']
        resources.srcDirs = ['common/src/test/resources']
    }
}

// Unit tests call LWJGL FreeType directly: the exact natives Minecraft 1.20.5 through 1.21.11 ship.
def lwjglNatives = {
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch').toLowerCase()
    def arm = arch.contains('aarch64') || arch.contains('arm64')
    if (os.contains('win')) return arm ? 'natives-windows-arm64' : 'natives-windows'
    if (os.contains('mac')) return arm ? 'natives-macos-arm64' : 'natives-macos'
    return arm ? 'natives-linux-arm64' : 'natives-linux'
}()

dependencies {
    testImplementation "org.lwjgl:lwjgl:${project.lwjgl_version}"
    testImplementation "org.lwjgl:lwjgl-freetype:${project.lwjgl_version}"
    testRuntimeOnly "org.lwjgl:lwjgl:${project.lwjgl_version}:${lwjglNatives}"
    testRuntimeOnly "org.lwjgl:lwjgl-freetype:${project.lwjgl_version}:${lwjglNatives}"
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

jar.enabled = false

// Copies the five release jars into dist/.
tasks.register('collectJars', Copy) {
    def jars = ['neoforge-1.20.6': 'jar', 'neoforge-1.21.2': 'jar',
                'fabric-1.20.5': 'remapJar', 'fabric-1.21.2': 'remapJar', 'fabric-1.21.9': 'remapJar']
    jars.each { name, task -> from(project(":versions:${name}").tasks.named(task)) }
    into layout.projectDirectory.dir('dist')
}
