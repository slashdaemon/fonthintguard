pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'fonthintguard'

// One shared source tree (common/ + fabric/ + neoforge/), five jars. Each versions/<name>/ is a
// build.gradle + gradle.properties: the Minecraft version it compiles against, its glyph era and the
// range it ships for. See CLAUDE.md "Jars".
include 'versions:neoforge-1.20.6'   // NeoForge 20.6 .. 21.1
include 'versions:neoforge-1.21.2'   // NeoForge 21.2 .. 21.11
include 'versions:fabric-1.20.5'     // Fabric MC 1.20.5 .. 1.21.1
include 'versions:fabric-1.21.2'     // Fabric MC 1.21.2 .. 1.21.8
include 'versions:fabric-1.21.9'     // Fabric MC 1.21.9 .. 1.21.11
