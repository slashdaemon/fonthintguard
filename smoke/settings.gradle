pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

// Boot test harness, separate from the main build: smoke/run.sh starts one real client per Minecraft
// version / NeoForge line with a shipped jar from dist/ and the canary font pack. -Ploader picks the
// one project to configure, so a Fabric run never sets up NeoForge and the other way round.
rootProject.name = 'fonthintguard-smoke'
include providers.gradleProperty('loader').getOrElse('fabric')
